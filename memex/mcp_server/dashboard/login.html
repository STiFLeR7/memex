<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>memex Team Dashboard — Login</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div id="app-container">
        <div id="workspace" style="align-items: center; justify-content: center;">
            <div style="max-width: 320px; width: 100%; padding: 24px;">
                <h2>memex Team Dashboard</h2>
                <form method="post" action="/login">
                    <p>
                        <label for="key">API key</label><br>
                        <input id="key" name="key" type="password" autocomplete="off" required style="width: 100%; box-sizing: border-box;">
                    </p>
                    <button type="submit">Log in</button>
                </form>
                <p style="margin-top: 16px; font-size: 0.85em; color: var(--text-muted, #858585);">
                    Don't have a key? Ask your team admin to run
                    <code>memex keys add &lt;your-name&gt; --role contributor</code> — see
                    <a href="https://github.com/STiFLeR7/memex/blob/master/docker/TEAM-DEPLOY.md#3-capture-the-initial-admin-key" target="_blank">docker/TEAM-DEPLOY.md</a>
                    for the full setup.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
