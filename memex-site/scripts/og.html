<!doctype html>
<!-- Source of public/og.jpg (1200×630). Render: npm run og.
     Same composition as the 1200 banner in brag-output/brand/render.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #F7F9F8; color: #111417; font-family: "Stack Sans Headline", Arial, sans-serif;
    background-image: repeating-linear-gradient(90deg, rgba(17,20,23,0.028) 0 1px, transparent 1px 34px); }
  .glass { position: absolute; border-radius: 120px; }
  .teal { width: 640px; height: 440px; left: -150px; bottom: -190px; transform: rotate(-8deg);
    background: linear-gradient(200deg, rgba(127,221,224,0.55), rgba(0,179,181,0.92) 70%, #00A5A8);
    box-shadow: 0 60px 140px rgba(0,179,181,0.28), inset 0 0 120px rgba(255,255,255,0.35); }
  .lime { width: 560px; height: 400px; right: -170px; top: -170px; transform: rotate(10deg);
    background: linear-gradient(160deg, rgba(230,248,200,0.75), rgba(142,220,90,0.85) 75%, #7FD24C);
    box-shadow: 0 60px 140px rgba(142,220,90,0.30), inset 0 0 120px rgba(255,255,255,0.40); }
  .brand { position: absolute; left: 72px; top: 72px; display: flex; align-items: center; gap: 18px; }
  .brand b { font-weight: 650; font-size: 32px; letter-spacing: -0.02em; }
  .ver { margin-left: 8px; display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; font-size: 22px;
    background: rgba(255,255,255,0.75); border: 1px solid rgba(17,20,23,0.12); box-shadow: 0 10px 26px rgba(17,20,23,0.07), inset 0 1px 0 #fff; }
  h1 { position: absolute; left: 72px; top: 190px; font-weight: 220; font-size: 70px; letter-spacing: -0.035em; line-height: 1.04; }
  p { position: absolute; left: 72px; top: 370px; max-width: 720px; font-weight: 300; font-size: 26px; line-height: 1.35; color: #4A5157; }
  .url { position: absolute; right: 72px; bottom: 52px; font-weight: 650; font-size: 24px; }
</style>
</head>
<body>
<div class="glass teal"></div>
<div class="glass lime"></div>
<div class="brand">
  <svg width="52" height="52" viewBox="0 0 512 512" aria-hidden="true">
    <defs>
      <linearGradient id="mt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FDDE0"/><stop offset="0.7" stop-color="#00B3B5"/><stop offset="1" stop-color="#00A5A8"/></linearGradient>
      <linearGradient id="ml" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6F8C8"/><stop offset="0.75" stop-color="#8EDC5A"/><stop offset="1" stop-color="#7FD24C"/></linearGradient>
      <linearGradient id="mo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D8F5EE"/></linearGradient>
      <clipPath id="mc"><rect x="196" y="76" width="260" height="260" rx="78"/></clipPath>
    </defs>
    <rect x="56" y="176" width="260" height="260" rx="78" fill="url(#mt)"/>
    <rect x="196" y="76" width="260" height="260" rx="78" fill="url(#ml)"/>
    <rect x="56" y="176" width="260" height="260" rx="78" fill="url(#mo)" clip-path="url(#mc)"/>
    <rect x="56" y="176" width="260" height="260" rx="78" fill="none" stroke="#fff" stroke-width="6" stroke-opacity="0.9" clip-path="url(#mc)"/>
  </svg>
  <b>memex</b><span class="ver">v1.0.2</span>
</div>
<h1>Trusted engineering context<br>for AI coding agents.</h1>
<p>Keeps your agent's engineering context current as the code changes.</p>
<div class="url">memex.stifler.in</div>
</body>
</html>
