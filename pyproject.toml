[project]
name = "memex"
version = "0.1.0"
description = "Developer context continuity system building a temporal knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "graphiti-core[google-genai]",
    "tree-sitter-language-pack",
    "watchdog",
    "mcp",
    "fastapi",
    "uvicorn",
    "apscheduler",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
    "gitpython",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (requires Neo4j/Gemini)",
]

[project.scripts]
memex = "memex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
