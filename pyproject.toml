[project]
name = "memex"
version = "0.1.0"
description = "Developer context continuity system — temporal knowledge graph for AI coding agents, served via MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["mcp", "ai-agents", "knowledge-graph", "developer-tools", "context"]
dependencies = [
    "graphiti-core[google-genai]>=0.28.0",
    "tree-sitter-language-pack>=1.8.0",
    "watchdog>=6.0.0",
    "mcp>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "apscheduler>=3.11.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "gitpython>=3.1.40",
]

[project.urls]
"Homepage" = "https://github.com/STiFLeR7/memex"

[tool.uv]
managed = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (requires Neo4j/Gemini)",
]

[project.scripts]
memex = "memex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
